<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-density="compact" data-quote="hover" data-tokbar="on" data-now="on" data-tweaks="closed">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>思维栏 v0 · DSH 三层记忆</title>
<style>
/* 思维栏 v0 — 独立设计原型
 * 深色 token 全部来自 DSH 宿主主题（@deepseek-ai/dsh-client-ui-theme
 * 的 design_platform 层，body / body[data-ds-dark-theme] 两块），
 * 逐条解析成 hex 后内联。浅色是对照，用同一套语义槽位的浅色值。
 * 没有发明新色相：分类色只取宿主的 state-business / state-error / state-warn。 */
:root{
  --font-ui: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif;
  --font-mono: "Cascadia Mono", "Consolas", "SFMono-Regular", "DejaVu Sans Mono", monospace;

  /* ── 宿主 alias 层（dark） ─────────────────────────────── */
  --bg-base:      #151517;   /* --dsw-alias-bg-base          neutral-bluish-950 */
  --bg-layer-1:   #232324;   /* --dsw-alias-bg-layer-1       neutral-bluish-875 */
  --bg-layer-2:   #2c2c2e;   /* --dsw-alias-bg-layer-2       neutral-bluish-850 */
  --bg-layer-3:   #353638;   /* --dsw-alias-bg-layer-3       neutral-bluish-800 */
  --bg-module:    #353638;   /* --dsw-alias-bg-module-platform */
  --code-block:   #1b1b1c;   /* --dsw-alias-markdown-code-block */
  --inline-code:  #292929;   /* --dsw-alias-markdown-inline-code */

  --label-primary:    #f9fafb; /* neutral-bluish-50  */
  --label-secondary:  #cfd3d6; /* neutral-bluish-300 */
  --label-tertiary:   #adb2b8; /* neutral-bluish-400 */
  --label-quaternary: #81858c; /* neutral-bluish-600 */
  --label-inverted:   #0f1115; /* neutral-bluish-1000 */

  --border-l1: #ffffff0f;
  --border-l2: #ffffff1f;
  --border-l3: #ffffff29;

  --hover:  #ffffff14;  /* --dsw-alias-interactive-bg-hover  */
  --active: #ffffff24;  /* --dsw-alias-interactive-bg-active */
  --skeleton: #ffffff14;

  /* 语义色 = 宿主 state-*，不是新色相 */
  --accent:       #f59e0b;  /* --dsw-static-amber-500 / state-warn-primary */
  --accent-label: #dd8629;  /* --dsw-static-amber-600 / state-warn-label   */
  --info:         #7aaaff;  /* --dsw-alias-state-business-primary          */
  --error:        #f25a5a;  /* --dsw-alias-state-error-primary             */
  --success:      #22c55e;  /* --dsw-alias-state-success-primary           */
  --scrollbar:      #3c3c3d;
  --scrollbar-hover:#545557;

  /* ── 非颜色 token（8pt 栅格） ───────────────────────────── */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px;
  --r-xs:3px; --r-sm:4px; --r-md:6px; --r-lg:8px;
  --t: 160ms cubic-bezier(.2,.7,.3,1);
  --shadow: 0 8px 28px #00000059;

  --row-py: 7px;
  --fs-body: 13.5px;
  --fs-small: 12px;
  --fs-micro: 11px;
  --lh-body: 1.5;
  --spine-x: 40px;      /* 轮次刻度线距左缘 */
  --gutter: 26px;       /* 刻度线 → 内容 */
}
:root[data-theme="light"]{
  --bg-base:      #fff;
  --bg-layer-1:   #fff;
  --bg-layer-2:   #fff;
  --bg-layer-3:   #f1f3f5;
  --bg-module:    #f5f6f7;
  --code-block:   #f9fafb;
  --inline-code:  #fafafa;
  --label-primary:    #0f1115;
  --label-secondary:  #61666b;
  --label-tertiary:   #81858c;
  --label-quaternary: #adb2b8;
  --label-inverted:   #fff;
  --border-l1: #0000000a;
  --border-l2: #0000001a;
  --border-l3: #0000001f;
  --hover:  #2631480f;
  --active: #2631481a;
  --skeleton: #0000000a;
  --info:   #4176e6;
  --error:  #ec1313;
  --scrollbar: #e5e5e5;
  --scrollbar-hover: #d4d4d4;
  --shadow: 0 8px 28px #0000001a;
}

*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0;
  background:var(--bg-base);
  color:var(--label-primary);
  font-family:var(--font-ui);
  font-size:var(--fs-body);
  line-height:var(--lh-body);
  -webkit-font-smoothing:antialiased;
  text-wrap:pretty;
}
button{ font:inherit; color:inherit; }
:focus-visible{ outline:1px solid var(--info); outline-offset:1px; }
::selection{ background:#7aaaff40; }

/* 滚动条：宿主 alias-scrollbar-* */
*{ scrollbar-width:thin; scrollbar-color:var(--scrollbar) transparent; }
*::-webkit-scrollbar{ width:9px; height:9px; }
*::-webkit-scrollbar-thumb{ background:var(--scrollbar); border-radius:99px; border:2px solid transparent; background-clip:content-box; }
*::-webkit-scrollbar-thumb:hover{ background:var(--scrollbar-hover); background-clip:content-box; }
*::-webkit-scrollbar-track{ background:transparent; }

/* ══ 外壳：模拟宿主的内容列（不是落地页，没有 hero） ═══════════ */
.shell{
  max-width:940px; margin:0 auto; min-height:100%;
  padding:var(--s5) var(--s5) 96px;
}

/* ── 页头 ──────────────────────────────────────────────── */
.head{ display:flex; flex-direction:column; gap:var(--s2); padding-bottom:var(--s3); border-bottom:1px solid var(--border-l1); }
.head-top{ display:flex; align-items:baseline; justify-content:space-between; gap:var(--s3); }
.head-title{ font-size:15px; font-weight:600; letter-spacing:.01em; }
.head-meta{ display:flex; align-items:center; gap:var(--s3); font-size:var(--fs-micro); color:var(--label-quaternary); }
.head-meta b{ font-weight:500; color:var(--label-tertiary); font-variant-numeric:tabular-nums; }
.head-sub{ font-size:var(--fs-micro); color:var(--label-quaternary); font-variant-numeric:tabular-nums; }
.head-sub code{ font-family:var(--font-mono); font-size:10.5px; }

/* ── 通用区段 ──────────────────────────────────────────── */
.sec{ margin-top:var(--s5); }
.sec-head{ display:flex; align-items:center; gap:var(--s2); margin-bottom:var(--s2); min-height:22px; }
.sec-name{ font-size:var(--fs-micro); font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--label-tertiary); }
.sec-stat{ font-size:var(--fs-micro); color:var(--label-quaternary); font-variant-numeric:tabular-nums; }
.sec-head .spacer{ flex:1; }
.sec-note{ font-size:var(--fs-micro); color:var(--label-quaternary); margin:0 0 var(--s2); }

/* 轮次锚点：tabular-nums 是数据密集列表的关键 */
.tnum{ font-variant-numeric:tabular-nums; }

/* ── 引用按钮：默认只在 hover/focus 出现 ────────────────── */
.qbtn{
  opacity:0; transition:opacity var(--t), border-color var(--t), color var(--t);
  font-size:var(--fs-micro); line-height:1.3; padding:1px 7px;
  border:1px solid var(--border-l2); border-radius:var(--r-sm);
  background:transparent; color:var(--label-tertiary); cursor:pointer; white-space:nowrap;
}
:root[data-quote="always"] .qbtn{ opacity:1; }
.row:hover .qbtn, .row:focus-within .qbtn, .sec:hover > .sec-head .qbtn, .sec:focus-within > .sec-head .qbtn{ opacity:1; }
.qbtn:hover{ border-color:var(--label-primary); color:var(--label-primary); }
.qbtn:active{ background:var(--active); }

/* ── 1 · 任务标题 ──────────────────────────────────────── */
.task{ display:flex; align-items:flex-start; gap:var(--s3); padding:var(--s2) 0 0; }
.task-title{ flex:1; margin:0; font-size:14px; font-weight:600; line-height:1.45; color:var(--label-primary); }
.task-sub{ font-size:var(--fs-micro); color:var(--label-quaternary); margin:var(--s1) 0 0; }

/* ── 2 · 里程碑主线骨架（签名件：左侧 2px 轮次刻度线） ────── */
.locate{
  display:flex; align-items:center; gap:var(--s2);
  font-size:var(--fs-micro); color:var(--label-quaternary); font-variant-numeric:tabular-nums;
}
.locate .now{
  display:inline-flex; align-items:center; gap:5px;
  padding:1px 7px; border-radius:99px;
  border:1px solid var(--border-l2); background:var(--bg-layer-2);
  color:var(--label-secondary);
}
.locate .now::before{ content:""; width:5px; height:5px; border-radius:50%; background:var(--accent); }

.track{ position:relative; }
/* 贯穿全骨架的刻度线（签名件） */
.track::before{
  content:""; position:absolute; left:calc(var(--spine-x) - 1px); top:4px; bottom:0; width:2px;
  background:var(--border-l2); border-radius:1px;
}

/* 分组：标题用「第 N–M 轮」，不用分隔线 */
.grp{ display:block; position:relative; }
.grp-head{
  position:relative; display:flex; align-items:center; gap:var(--s2);
  /* 左内边距必须让开刻度线：标签原本从内容列左缘（x=0）起排，
     而 .dot 是绝对定位在刻度线上的（spine-x-4 → +4），任何超过 ~30px 的标签
     都会从「第 1–8」的「轮」字开始被小方块压住（实测 11 个组头全中）。
     缩进到 spine-x + gutter = 与 .row 的正文列（.body-col）同一竖线，
     组头标签因此和条目标题对齐，刻度线上的方块也就落在标签左侧的空白里。
     注意：padding 不会移动绝对定位的 .dot（它的定位原点是 padding 盒），方块仍钉在刻度线上。 */
  padding:var(--s3) 0 var(--s1) calc(var(--spine-x) + var(--gutter));
  font-size:var(--fs-micro); font-variant-numeric:tabular-nums;
}
.grp-head .span{ color:var(--label-secondary); font-weight:600; letter-spacing:.02em; }
.grp-head .stat{ color:var(--label-quaternary); }
.grp-head .bar{ flex:1; height:1px; background:var(--border-l1); }
.grp-head .dot{
  /* 落在刻度线正中（线在 spine-x-1 起、宽 2px → 中心 spine-x） */
  position:absolute; left:calc(var(--spine-x) - 4px); top:calc(var(--s3) + 7px);
  width:8px; height:8px; border-radius:2px; background:var(--bg-layer-3);
  box-shadow:0 0 0 3px var(--bg-base);
}
.grp.is-now .grp-head .dot{ background:var(--accent); }
.grp.is-now .grp-head .span{ color:var(--accent-label); }

.rows{ list-style:none; margin:0; padding:0; }
.row{
  position:relative;
  display:grid; grid-template-columns:var(--spine-x) 1fr auto;
  align-items:start;
  padding:var(--row-py) 0;
  transition:background var(--t);
  border-radius:var(--r-sm);
}
.row + .row{ box-shadow:0 -1px 0 var(--border-l1) inset; }
.row:hover{ background:var(--hover); }
.row:focus-within{ background:var(--hover); }

/* 轮次锚点：低对比中性色，落在刻度线上 */
.anchor{
  padding-right:var(--s2); text-align:right;
  font-family:var(--font-mono); font-size:10.5px; line-height:1.9;
  color:var(--label-quaternary); font-variant-numeric:tabular-nums; letter-spacing:-.02em;
}
.anchor .tick{
  position:absolute; left:calc(var(--spine-x) - 4.5px); top:calc(50% - .5px);
  width:11px; height:2px; background:var(--bg-layer-3); border-radius:1px;
}
.row:hover .anchor .tick{ background:var(--label-tertiary); }
/* 当前轮：中性底色 + 刻度线上加粗的一段 + 金色锚点（不抢戏，但一眼能找到） */
.row.is-now{ background:color-mix(in srgb, var(--accent) 8%, transparent); }
.row.is-now:hover{ background:color-mix(in srgb, var(--accent) 14%, transparent); }
.row.is-now .anchor{ color:var(--accent-label); font-weight:500; }
.row.is-now .anchor .tick{ background:var(--accent); height:3px; top:calc(50% - 1.5px); width:17px; left:calc(var(--spine-x) - 8.5px); }

.body-col{ padding-left:var(--gutter); min-width:0; }
.row-title{ display:flex; align-items:baseline; gap:var(--s2); }
.row-title h4{
  margin:0; font-size:var(--fs-body); font-weight:400; line-height:1.45;
  color:var(--label-primary); flex:1; min-width:0;
}
.row-cause{ margin:2px 0 0; font-size:var(--fs-small); line-height:1.45; color:var(--label-tertiary); }
.row-cause::before{ content:"— "; color:var(--label-quaternary); }

/* 分类标记：不用彩色 pill，只用一条 2px 竖条 + 极小字 */
.cat{
  flex:none; display:inline-flex; align-items:center; gap:4px;
  font-size:10.5px; line-height:1.6; color:var(--label-quaternary); white-space:nowrap;
}
.cat::before{ content:""; width:2px; height:10px; border-radius:1px; background:var(--label-quaternary); }
.cat[data-cat="失败"],.cat[data-cat="回退"],.cat[data-cat="中断"]{ color:var(--error); }
.cat[data-cat="失败"]::before,.cat[data-cat="回退"]::before,.cat[data-cat="中断"]::before{ background:var(--error); }
.cat[data-cat="转向"],.cat[data-cat="目标"],.cat[data-cat="决策"]{ color:var(--info); }
.cat[data-cat="转向"]::before,.cat[data-cat="目标"]::before,.cat[data-cat="决策"]::before{ background:var(--info); }
.cat[data-cat="交付"],.cat[data-cat="验证"]{ color:var(--success); }
.cat[data-cat="交付"]::before,.cat[data-cat="验证"]::before{ background:var(--success); }
.cat[data-cat="压缩"]{ color:var(--accent-label); }
.cat[data-cat="压缩"]::before{ background:var(--accent); }

/* token 微条：读密度的量，不读颜色 */
.tokbar{ display:flex; align-items:center; gap:var(--s2); flex:none; padding-top:5px; }
.tokbar .num{ font-family:var(--font-mono); font-size:10.5px; color:var(--label-quaternary); font-variant-numeric:tabular-nums; min-width:22px; text-align:right; }
.tokbar .track2{ width:34px; height:2px; border-radius:1px; background:var(--border-l2); overflow:hidden; }
.tokbar .fill{ display:block; height:100%; background:var(--label-quaternary); }
.row:hover .tokbar .fill{ background:var(--label-tertiary); }
:root[data-tokbar="off"] .tokbar{ display:none; }
:root[data-tokbar="off"] .row{ grid-template-columns:var(--spine-x) 1fr auto; }

/* ── 3 · L2 短期摘要 ───────────────────────────────────── */
.l2-wrap{ border:1px solid var(--border-l2); border-radius:var(--r-md); background:var(--bg-layer-1); }
.l2-sum{
  display:flex; align-items:center; gap:var(--s2); cursor:pointer; list-style:none;
  padding:var(--s2) var(--s3); font-size:var(--fs-micro); color:var(--label-tertiary);
  font-variant-numeric:tabular-nums;
}
.l2-sum::-webkit-details-marker{ display:none; }
.l2-sum .caret{ width:8px; height:8px; border-right:1.5px solid currentColor; border-bottom:1.5px solid currentColor; transform:rotate(-45deg); transition:transform var(--t); flex:none; margin-left:-2px; }
details[open] > .l2-sum .caret{ transform:rotate(45deg); }
.l2-sum .grow{ flex:1; }
.l2-body{ padding:0 var(--s3) var(--s3); border-top:1px solid var(--border-l1); }
.l2-sec + .l2-sec{ margin-top:var(--s3); padding-top:var(--s3); border-top:1px solid var(--border-l1); }
.l2-sec h5{ margin:0 0 var(--s1); font-size:var(--fs-small); font-weight:600; color:var(--label-secondary); letter-spacing:.01em; }
.l2-sec ul{ margin:0; padding-left:var(--s4); }
.l2-sec li{ font-size:var(--fs-small); line-height:1.62; color:var(--label-tertiary); margin:1px 0; }
.l2-sec li.sub{ list-style:circle; margin-left:var(--s3); color:var(--label-quaternary); }
.l2-sec p{ margin:0; font-size:var(--fs-small); line-height:1.62; color:var(--label-tertiary); }
.l2-sec li::marker{ color:var(--label-quaternary); }
.l2-sec strong{ font-weight:600; color:var(--label-secondary); }
.l2-sec code{
  font-family:var(--font-mono); font-size:11px; padding:0 3px; border-radius:var(--r-xs);
  background:var(--inline-code); border:1px solid var(--border-l1); color:var(--label-secondary);
}
.l2-fold{ padding:var(--s2) var(--s3) 0; }
.l2-fold button{
  border:1px solid var(--border-l2); background:transparent; color:var(--label-tertiary);
  border-radius:var(--r-sm); padding:2px 9px; font-size:var(--fs-micro); cursor:pointer; transition:var(--t);
}
.l2-fold button:hover{ color:var(--label-primary); border-color:var(--label-primary); }

/* ── 4 · L3 深层记忆（按会话分组） ──────────────────────── */
.sess{ border:1px solid var(--border-l1); border-radius:var(--r-md); background:var(--bg-layer-1); }
.sess + .sess{ margin-top:var(--s2); }
.sess-sum{
  display:flex; align-items:center; gap:var(--s2); cursor:pointer; list-style:none;
  padding:var(--s2) var(--s3); font-size:var(--fs-micro); font-variant-numeric:tabular-nums;
}
.sess-sum::-webkit-details-marker{ display:none; }
.sess-sum .caret{ width:7px; height:7px; border-right:1.5px solid var(--label-quaternary); border-bottom:1.5px solid var(--label-quaternary); transform:rotate(-45deg); transition:transform var(--t); flex:none; }
details[open] > .sess-sum .caret{ transform:rotate(45deg); }
.sess-id{ font-family:var(--font-mono); font-size:10.5px; color:var(--label-tertiary); }
.sess-sum .grow{ flex:1; height:1px; background:var(--border-l1); }
.sess-sum .stat{ color:var(--label-quaternary); white-space:nowrap; }
.badge{
  font-size:10px; line-height:1.6; padding:0 6px; border-radius:99px; white-space:nowrap;
  border:1px solid var(--border-l2); color:var(--label-quaternary);
}
.badge.own{ border-color:#f59e0b59; color:var(--accent-label); }
.sess-body{ border-top:1px solid var(--border-l1); }

.rec{
  display:grid; grid-template-columns:1fr auto; gap:var(--s3);
  padding:var(--s2) var(--s3); align-items:start;
}
.rec + .rec{ border-top:1px solid var(--border-l1); }
.rec:hover{ background:var(--hover); }
.rec-meta{
  display:flex; align-items:center; gap:var(--s2); flex-wrap:wrap;
  font-size:10.5px; color:var(--label-quaternary); font-variant-numeric:tabular-nums;
}
.rec-meta .kind{ display:inline-flex; align-items:center; gap:4px; color:var(--label-tertiary); }
.rec-meta .kind::before{ content:""; width:2px; height:9px; border-radius:1px; background:var(--label-quaternary); }
.rec-meta .kind[data-kind="milestone"]{ color:var(--accent-label); }
.rec-meta .kind[data-kind="milestone"]::before{ background:var(--accent); }
.rec-meta .kind[data-kind="digest"]{ color:var(--info); }
.rec-meta .kind[data-kind="digest"]::before{ background:var(--info); }
.rec-meta .id{ font-family:var(--font-mono); font-size:10px; color:var(--label-quaternary); opacity:.8; }
.rec-text{
  margin:var(--s1) 0 0; font-size:var(--fs-small); line-height:1.55; color:var(--label-tertiary);
  overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  white-space:pre-wrap; overflow-wrap:anywhere;
}
.rec.open .rec-text{ -webkit-line-clamp:unset; display:block; }
.rec-text .h{ color:var(--label-secondary); font-weight:600; }
.rec-actions{ display:flex; align-items:center; gap:var(--s2); }
.rec-toggle{
  border:1px solid var(--border-l1); background:transparent; color:var(--label-quaternary);
  border-radius:var(--r-sm); padding:0 6px; font-size:10px; line-height:1.7; cursor:pointer; transition:var(--t);
}
.rec-toggle:hover{ color:var(--label-primary); border-color:var(--border-l2); }
.rec.open .rec-toggle{ color:var(--label-secondary); }

/* 空态 / 降级态（面板只负责显示，拿不到数据就说清楚） */
.empty{
  padding:var(--s3); border:1px dashed var(--border-l2); border-radius:var(--r-md);
  font-size:var(--fs-small); color:var(--label-quaternary);
}

/* ── 页脚注 ────────────────────────────────────────────── */
.foot{ margin-top:var(--s5); padding-top:var(--s3); border-top:1px solid var(--border-l1); font-size:var(--fs-micro); color:var(--label-quaternary); }
.foot code{ font-family:var(--font-mono); color:var(--label-tertiary); }

/* ── 引用反馈（对应真实实现的 memQuoted / memQuoteFailed） ─ */
.quote-note{
  position:fixed; left:50%; bottom:var(--s5); transform:translateX(-50%);
  padding:6px 14px; border-radius:99px; font-size:var(--fs-small);
  background:var(--bg-layer-3); border:1px solid var(--border-l2); color:var(--label-secondary);
  box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity var(--t), transform var(--t);
  z-index:60; max-width:min(560px,86vw);

<script>
/* 思维栏 v0 — 运行时（无依赖）。数据全部来自内联的 DATA。 */
(function () {
  'use strict';
  var DATA = window.__TLM__;
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var root = document.documentElement;

  // ── 状态 ────────────────────────────────────────────────────────
  var S = {
    group: 'turn',      // turn | category | none
    bucket: 8,          // 按轮次聚类时的桶宽
    density: 'compact', // compact | comfort
    theme: 'dark',
    now: true,
    quote: 'hover',
    tokbar: true,
    hideNoise: false,
    l2: 'fold',         // fold | open
  };
  var SAVE_KEY = 'tlm-thinking-column-v0';

  function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* 隐私模式 */ } }
  function load() {
    try {
      var raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return;
      var o = JSON.parse(raw);
      for (var k in S) if (k in o) S[k] = o[k];
    } catch (e) { /* 坏值就用默认 */ }
  }

  function apply() {
    root.setAttribute('data-theme', S.theme);
    root.setAttribute('data-density', S.density === 'comfort' ? 'comfort' : 'compact');
    root.setAttribute('data-quote', S.quote === 'always' ? 'always' : 'hover');
    root.setAttribute('data-tokbar', S.tokbar ? 'on' : 'off');
    root.setAttribute('data-now', S.now ? 'on' : 'off');
  }

  // ── 引用：真实实现是 inputActions.setDraft **追加**进输入框；原型里落到剪贴板 ──
  // 失败必须说出来（对应实现的 memQuoteFailed）——一个点了没反应的按钮，在这个插件里
  // 就是第三次"看起来在工作"的静默故障。
  var noteTimer = null;
  function legacyCopy(text) {
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.top = '-1000px'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (e) { return false }
  }
  function quote(label, body) {
    var block = '[' + label + ']\n' + body;
    function fallback() {
      // 只试一次：user gesture 只能消费一次，重复调用必然失败
      if (legacyCopy(block)) note('已引用 ' + label + '（回退复制；实际会追加进输入框）', false);
      else note('引用失败：原型拿不到剪贴板（实际实现会追加进输入框）', true);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(block).then(
        function () { note('已引用 ' + label + '（原型写入剪贴板；实际会追加进输入框）', false) },
        fallback,
      );
    } else fallback();
  }
  function note(text, bad) {
    var el = $('#note');
    el.textContent = text;
    el.classList.add('on');
    el.style.borderColor = bad ? 'var(--error)' : 'var(--border-l2)';
    if (noteTimer) clearTimeout(noteTimer);
    noteTimer = setTimeout(function () { el.classList.remove('on'); }, 2600);
  }

  // ── 小工具 ──────────────────────────────────────────────────────
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }
  function span(from, to) {
    return (to === undefined || to === null || to === from) ? ('第 ' + from + ' 轮') : ('第 ' + from + '–' + to + ' 轮');
  }
  function shortSpan(from, to) {
    return (to === undefined || to === null || to === from) ? ('第' + from + '轮') : (from + '–' + to);
  }
  function fmtTokens(n) { return n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n); }
  // 内联 markdown：只处理 `code` 和 **bold**（正文一字不改）
  function rich(text) {
    var frag = document.createDocumentFragment();
    var re = /(`[^`]+`|\*\*[^*]+\*\*)/g, last = 0, m;
    while ((m = re.exec(text)) !== null) {
      if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      var tok = m[0];
      if (tok.charAt(0) === '`') frag.appendChild(el('code', null, tok.slice(1, -1)));
      else frag.appendChild(el('strong', null, tok.slice(2, -2)));
      last = m.index + tok.length;
    }
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    return frag;
  }

  // ── 页头 ────────────────────────────────────────────────────────
  function renderHead() {
    var m = DATA.meta;
    $('#head-title').textContent = '思维栏';
    var meta = $('#head-meta');
    meta.appendChild(el('span', null, '会话 '));
    meta.appendChild(el('b', 'tnum', m.shortId));
    meta.appendChild(el('span', null, '· 抽取于 ' + m.extractedAt.replace('T', ' ').slice(0, 19) + ' UTC'));
    $('#head-sub').textContent = m.turnCount + ' 轮 · ' + m.events.toLocaleString() + ' 事件 · ' +
      m.frames.toLocaleString() + ' 个 zstd 帧 · 日志 ' + (m.logBytes / 1048576).toFixed(1) + ' MB';
    $('#head-sub').appendChild(el('code', null, '  session.v4.jsonl.zstd'));
  }

  // ── 1 · 任务标题 ────────────────────────────────────────────────
  function renderTask() {
    $('#task-title').textContent = DATA.taskTitle || '（尚未识别出任务标题）';
    var btn = el('button', 'qbtn', '引用');
    btn.type = 'button';
    btn.title = '引用 · 任务标题';
    btn.addEventListener('click', function () { quote('记忆引用 · 任务标题', DATA.taskTitle); });
    $('#task-row').appendChild(btn);
  }

  // ── 2 · 骨架：分组 ──────────────────────────────────────────────
  // 分组标签报**实际包含的轮次**，不是「最小–最大」：跨轮里程碑（如「第 8–14 轮」）
  // 会让相邻桶的标签互相重叠（实测出现「第 1–14 轮」紧接着「第 12–17 轮」），
  // 那种标签在扫读时会读成"这段覆盖到 14 轮"，是错的。
  function turnLabel(turns) {
    // 去重：多条里程碑可以同轮（实测第 1 轮有 3 条），不去重会印出「第 1、1、1–2 轮」
    var u = [];
    turns.forEach(function (t) { if (u.indexOf(t) < 0) u.push(t) });
    u.sort(function (a, b) { return a - b; });
    var runs = [], s = u[0], p = u[0];
    for (var i = 1; i < u.length; i++) {
      if (u[i] === p + 1) { p = u[i]; continue }
      runs.push([s, p]); s = p = u[i];
    }
    runs.push([s, p]);
    return '第 ' + runs.map(function (r) { return r[0] === r[1] ? r[0] : (r[0] + '–' + r[1]) }).join('、') + ' 轮';
  }

  function groupMainline(items) {
    if (S.group === 'none') return [{ key: 'all', label: null, items: items }];
    if (S.group === 'category') {
      var order = ['任务', '目标', '转向', '决策', '指令', '交付', '验证', '压缩', '回退', '失败', '中断', '事件'];
      var map = {};
      items.forEach(function (it) { (map[it.category] = map[it.category] || []).push(it); });
      return order.filter(function (c) { return map[c]; }).map(function (c) {
        var turns = map[c].map(function (i) { return i.turn; });
        return {
          key: 'c-' + c, label: c, cat: c, items: map[c],
          stat: map[c].length + ' 条 · ' + map[c].reduce(function (s, i) { return s + i.tokens; }, 0) + ' tok',
          span: turnLabel(turns),
          from: Math.min.apply(null, turns), to: Math.max.apply(null, turns),
        };
      });
    }
    // 按轮次聚类：桶宽 = S.bucket
    var buckets = [], cur = null;
    items.forEach(function (it) {
      var b = Math.floor((it.turn - 1) / S.bucket);
      if (!cur || cur.b !== b) { cur = { b: b, items: [] }; buckets.push(cur); }
      cur.items.push(it);
    });
    return buckets.map(function (bk) {
      var turns = bk.items.map(function (i) { return i.turn; });
      return {
        key: 'b-' + bk.b,
        label: turnLabel(turns),
        stat: bk.items.length + ' 条 · ' + bk.items.reduce(function (s, i) { return s + i.tokens; }, 0) + ' tok',
        items: bk.items,
        from: Math.min.apply(null, turns),
        to: Math.max.apply(null, bk.items.map(function (i) { return i.turnTo === undefined ? i.turn : i.turnTo; })),
      };
    });
  }

  var MAX_ROW_TOK = Math.max.apply(null, DATA.mainline.map(function (m) { return m.tokens; }));

  function renderMainline() {
    var host = $('#mainline');
    host.textContent = '';
    var items = DATA.mainline.filter(function (m) { return !(S.hideNoise && (m.category === '事件' || m.category === '指令')); });
    var groups = groupMainline(items);
    var track = el('div', 'track');
    var nowGroup = null;

    groups.forEach(function (g) {
      var box = el('section', 'grp');
      var isNow = S.now && g.to !== undefined && DATA.meta.currentTurn >= g.from && DATA.meta.currentTurn <= g.to;
      if (isNow) { box.classList.add('is-now'); nowGroup = g; }
      var head = el('div', 'grp-head');
      head.appendChild(el('span', 'dot'));
      if (g.label) head.appendChild(el('span', 'span', g.label));
      else head.appendChild(el('span', 'span', '全部 ' + g.items.length + ' 条'));
      head.appendChild(el('span', 'stat', g.stat));
      head.appendChild(el('span', 'bar'));
      if (isNow) head.appendChild(el('span', 'stat', '当前'));
      var q = el('button', 'qbtn', '引用');
      q.type = 'button';
      q.title = '引用 · 主线骨架 · ' + (g.label || '全部');
      q.addEventListener('click', function () {
        quote('记忆引用 · 主线骨架 · ' + (g.label || '全部'), g.items.map(function (i) {
          return span(i.turn, i.turnTo) + ': ' + i.title + ' — ' + i.cause;
        }).join('\n'));
      });
      head.appendChild(q);
      box.appendChild(head);

      var ol = el('ol', 'rows');
      g.items.forEach(function (it) {
        var isNowRow = S.now && (it.turn === DATA.meta.currentTurn || (it.turnTo !== undefined && DATA.meta.currentTurn >= it.turn && DATA.meta.currentTurn <= it.turnTo));
        var li = el('li', 'row' + (isNowRow ? ' is-now' : ''));
        li.tabIndex = 0;
        li.setAttribute('data-turn', it.turn);

        var anchor = el('span', 'anchor tnum');
        anchor.appendChild(el('i', 'tick'));
        anchor.appendChild(document.createTextNode(it.turnTo === undefined ? String(it.turn) : (it.turn + '–' + it.turnTo)));
        li.appendChild(anchor);

        var body = el('div', 'body-col');
        var titleRow = el('div', 'row-title');
        titleRow.appendChild(el('h4', null, it.title));
        titleRow.appendChild(el('span', 'cat', it.category)).setAttribute('data-cat', it.category);
        body.appendChild(titleRow);
        body.appendChild(el('p', 'row-cause', it.cause));
        li.appendChild(body);

        var right = el('div', 'tokbar');
        right.appendChild(el('span', 'num tnum', it.tokens));
        var t2 = el('span', 'track2');
        var fill = el('i', 'fill');
        fill.style.width = Math.max(8, Math.round(it.tokens / MAX_ROW_TOK * 100)) + '%';
        t2.appendChild(fill);
        right.appendChild(t2);
        var qb = el('button', 'qbtn', '引用');
        qb.type = 'button';
        qb.title = '引用 · ' + span(it.turn, it.turnTo) + ' · ' + it.title;
        qb.addEventListener('click', function (e) {
          e.stopPropagation();
          quote('记忆引用 · 主线骨架 · ' + span(it.turn, it.turnTo), span(it.turn, it.turnTo) + ': ' + it.title + ' — ' + it.cause);
        });
        right.appendChild(qb);
        li.appendChild(right);

        ol.appendChild(li);
      });
      box.appendChild(ol);
      track.appendChild(box);
    });
    host.appendChild(track);

    // 定位读数：当前轮 + 覆盖范围
    var loc = $('#locate');
    loc.textContent = '';
    var now = el('span', 'now', '当前 第 ' + DATA.meta.currentTurn + ' 轮');
    loc.appendChild(now);
    var covered = items.length ? Math.min.apply(null, items.map(function (i) { return i.turn; })) + '–' + Math.max.apply(null, items.map(function (i) { return Math.max(i.turn, i.turnTo === undefined ? i.turn : i.turnTo); })) : '—';
    loc.appendChild(el('span', null, '骨架覆盖 ' + covered + ' 轮'));
    loc.appendChild(el('span', null, '· 分组 ' + groups.length + ' 段'));
    if (S.hideNoise) {
      var hidden = DATA.mainline.length - items.length;
      if (hidden > 0) loc.appendChild(el('span', null, '· 已折叠 ' + hidden + ' 条低信息量（指令/事件）'));
    }    $('#mainline-stat').textContent = DATA.mainline.length + ' 条 · ' + DATA.mainlineTokens + ' tok';
  }

  // ── 3 · L2 ──────────────────────────────────────────────────────
  function renderL2() {
    var l2 = DATA.l2;
    $('#l2-stat').textContent = span(l2.turnFrom, l2.turnTo) + ' · ' + l2.mode + ' · ' + l2.chars.toLocaleString() + ' 字符';
    var q = $('#l2-quote');
    q.addEventListener('click', function () {
      quote('记忆引用 · L2 摘要 · ' + span(l2.turnFrom, l2.turnTo),
        span(l2.turnFrom, l2.turnTo) + ': ' + l2.sections.map(function (s) {
          return s.h + '\n' + s.items.map(function (i) { return '- ' + i.v; }).join('\n');
        }).join('\n\n'));
    });
    $('#l2-note').textContent = '摘要遮蔽了 ' + l2.shadowedTokenCount.toLocaleString() + ' tokens（' +
      l2.totalSummaries + ' 次压缩中的最后一次，seq ' + l2.atSeq + '）。';
    var sum = $('#l2-sum');
    var body = $('#l2-body');
    var full = l2.sections;
    var visible = S.l2 === 'open' ? full : full.slice(0, 2);
    function draw() {
      body.textContent = '';
      (S.l2 === 'open' ? full : full.slice(0, 2)).forEach(function (sec) {
        var box = el('section', 'l2-sec');
        box.appendChild(el('h5', null, sec.h));
        var ul = el('ul');
        sec.items.forEach(function (it) {
          if (it.t === 'li') { var li = el('li'); li.appendChild(rich(it.v)); ul.appendChild(li); }
          else if (it.t === 'sub') { var li2 = el('li', 'sub'); li2.appendChild(rich(it.v)); ul.appendChild(li2); }
          else { var p = el('p'); p.appendChild(rich(it.v)); box.appendChild(p); }
        });
        if (ul.children.length) box.appendChild(ul);
        body.appendChild(box);
      });
      var fold = el('div', 'l2-fold');
      var b = el('button', null, S.l2 === 'open' ? '收起，只看前 2 节' : '展开全部 ' + full.length + ' 节');
      b.type = 'button';
      b.addEventListener('click', function (e) {
        e.preventDefault();
        S.l2 = S.l2 === 'open' ? 'fold' : 'open';
        sum.open = true;
        save(); draw();
      });
      fold.appendChild(b);
      body.appendChild(fold);
    }
    draw();
    sum.open = true;
  }

  // ── 4 · L3 ──────────────────────────────────────────────────────
  function renderL3() {
    var l3 = DATA.l3;
    $('#l3-stat').textContent = l3.count + ' 条 / ' + fmtTokens(l3.tokens) + ' tok（整库）· 本会话 ' +
      l3.sessionCount + ' 条 / ' + fmtTokens(l3.sessionTokens) + ' tok';
    $('#l3-note').textContent = 'L3 是跨会话共享的库：下面按会话分组，' + l3.sessionTotal +
      ' 个会话有记录。视图口径是整库前 ' + l3.viewRecords + ' 条；原型内联 ' + l3.shownRecords +
      ' 条（里程碑全留，轮次摘要抽最近 ' + l3.kindQuota.turn + ' 条，略过 ' + l3.droppedRecords + ' 条）。';

    var host = $('#l3');
    host.textContent = '';
    l3.groups.forEach(function (g) {
      var d = el('details', 'sess');
      d.open = g.own;
      var sum = el('summary', 'sess-sum');
      sum.appendChild(el('span', 'caret'));
      sum.appendChild(el('span', 'sess-id', g.own ? (DATA.meta.shortId + '（本会话）') : g.sessionId.replace(/^session-/, '').slice(0, 8)));
      sum.appendChild(el('span', 'badge' + (g.own ? ' own' : ''), g.own ? '本会话' : '其它会话'));
      sum.appendChild(el('span', 'grow'));
      sum.appendChild(el('span', 'stat tnum', '显示 ' + g.shown + ' / 库内 ' + g.count + ' 条 · ' + fmtTokens(g.tokens) + ' tok'));
      d.appendChild(sum);

      var body = el('div', 'sess-body');
      g.records.forEach(function (r) {
        var row = el('div', 'rec');
        var left = el('div');
        var meta = el('div', 'rec-meta');
        var k = el('span', 'kind', r.kindLabel);
        k.setAttribute('data-kind', r.kind);
        meta.appendChild(k);
        meta.appendChild(el('span', 'tnum', span(r.turnFrom, r.turnTo)));
        meta.appendChild(el('span', 'tnum', r.tokens + ' tok'));
        meta.appendChild(el('span', 'id', r.id));
        left.appendChild(meta);
        var p = el('p', 'rec-text');
        // 轮次/摘要记录的正文本身是多行 markdown。**保留换行**（pre-wrap + 2 行截断），
        // 不压平成一段：压平之后「## 任务主线」和「## 已完成的子任务」挤成一堵墙，
        // 而它们的前两行恰好就是最该先读到的那句。
        var lines = String(r.text).split('\n').map(function (l) { return l.replace(/\s+$/, '') }).filter(function (l) { return l.trim().length });
        lines.forEach(function (line, i) {
          if (i > 0) p.appendChild(document.createTextNode('\n'));
          if (/^#/.test(line)) p.appendChild(el('span', 'h', line.replace(/^#+\s*/, '')));
          else p.appendChild(rich(line));
        });
        left.appendChild(p);
        row.appendChild(left);

        var acts = el('div', 'rec-actions');
        var tg = el('button', 'rec-toggle', '展开');
        tg.type = 'button';
        tg.addEventListener('click', function () {
          row.classList.toggle('open');
          tg.textContent = row.classList.contains('open') ? '收起' : '展开';
        });
        acts.appendChild(tg);
        var qb = el('button', 'qbtn', '引用');
        qb.type = 'button';
        qb.title = '引用 · ' + r.id;
        qb.addEventListener('click', function () {
          quote('记忆引用 · L3 · ' + r.id + ' · ' + span(r.turnFrom, r.turnTo) + ' · ' + r.kind,
            span(r.turnFrom, r.turnTo) + ' · ' + r.kind + ': ' + r.text);
        });
        acts.appendChild(qb);
        row.appendChild(acts);
        body.appendChild(row);
      });
      d.appendChild(body);
      host.appendChild(d);
    });
  }

  // ── 页脚 ────────────────────────────────────────────────────────
  function renderFoot() {
    var m = DATA.meta;
    $('#foot').textContent = '数据来源：' + m.sessionId + ' 的会话日志（' + m.events.toLocaleString() + ' 事件）经插件 extractMilestones 抽取；' +
      'L3 读自 deep-memory.sqlite 的 records 表。本页是只读设计原型，不是插件运行时。';
  }

  // ── Tweaks ──────────────────────────────────────────────────────
  function seg(label, key, options, onChange) {
    var f = el('div', 'tw-field');
    f.appendChild(el('label', null, label));
    var box = el('div', 'seg');
    options.forEach(function (o) {
      var b = el('button', null, o.label);
      b.type = 'button';
      b.setAttribute('aria-pressed', String(S[key] === o.value));
      b.addEventListener('click', function () {
        S[key] = o.value; save(); onChange();
      });
      box.appendChild(b);
    });
    f.appendChild(box);
    f._sync = function () { [].forEach.call(box.children, function (b, i) { b.setAttribute('aria-pressed', String(S[key] === options[i].value)); }); };
    return f;
  }
  function toggle(label, key, onChange) {
    var f = el('div', 'sw');
    f.appendChild(el('span', null, label));
    var b = el('button');
    b.type = 'button';
    b.setAttribute('aria-pressed', String(!!S[key]));
    b.addEventListener('click', function () { S[key] = !S[key]; save(); b.setAttribute('aria-pressed', String(!!S[key])); onChange(); });
    f.appendChild(b);
    f._sync = function () { b.setAttribute('aria-pressed', String(!!S[key])); };
    return f;
  }

  var fields = [];
  function renderTweaks() {
    var box = $('#tw-body');
    box.textContent = '';
    fields = [];
    function add(f) { fields.push(f); box.appendChild(f); }

    add(seg('骨架分组粒度', 'group', [
      { label: '按轮次', value: 'turn' }, { label: '按 category', value: 'category' }, { label: '不分组', value: 'none' },
    ], function () { renderMainline(); fields.forEach(function (f) { f._sync && f._sync(); }); }));

    add(seg('轮次聚类桶宽', 'bucket', [
      { label: '4 轮', value: 4 }, { label: '8 轮', value: 8 }, { label: '16 轮', value: 16 },
    ], function () { renderMainline(); fields.forEach(function (f) { f._sync && f._sync(); }); }));

    add(seg('密度', 'density', [
      { label: '紧凑', value: 'compact' }, { label: '舒适', value: 'comfort' },
    ], function () { apply(); fields.forEach(function (f) { f._sync && f._sync(); }); }));

    add(seg('主题', 'theme', [
      { label: '深色', value: 'dark' }, { label: '浅色', value: 'light' },
    ], function () { apply(); fields.forEach(function (f) { f._sync && f._sync(); }); }));

    add(seg('引用按钮', 'quote', [
      { label: 'hover 显示', value: 'hover' }, { label: '常显', value: 'always' },
    ], function () { apply(); fields.forEach(function (f) { f._sync && f._sync(); }); }));

    add(toggle('当前轮高亮', 'now', function () { apply(); renderMainline(); }));
    add(toggle('token 微条', 'tokbar', function () { apply(); fields.forEach(function (f) { f._sync && f._sync(); }); }));
    add(toggle('折叠低信息量条目', 'hideNoise', function () { renderMainline(); fields.forEach(function (f) { f._sync && f._sync(); }); }));

    var foot = el('div', 'tw-foot');
    foot.appendChild(document.createTextNode('j / k 在骨架条目间移动，'));
    foot.appendChild(el('kbd', null, 'Enter'));
    foot.appendChild(document.createTextNode(' 引用。分组/密度/主题会记进 localStorage。'));
    box.appendChild(foot);
  }

  function setTweaks(open) {
    root.setAttribute('data-tweaks', open ? 'open' : 'closed');
    try { localStorage.setItem(SAVE_KEY + ':open', open ? '1' : '0'); } catch (e) { /* ignore */ }
  }

  // ── 键盘：j/k 移动（刻意不用 scrollIntoView，避免影响外层容器滚动） ──
  function focusStep(dir) {
    var rows = [].slice.call(document.querySelectorAll('.row'));
    if (!rows.length) return;
    var idx = rows.indexOf(document.activeElement);
    var next = idx < 0 ? (dir > 0 ? 0 : rows.length - 1) : Math.min(rows.length - 1, Math.max(0, idx + dir));
    rows[next].focus({ preventScroll: true });
    var r = rows[next].getBoundingClientRect();
    var vh = window.innerHeight;
    if (r.top < 90) window.scrollBy({ top: r.top - 110, behavior: 'auto' });
    else if (r.bottom > vh - 20) window.scrollBy({ top: r.bottom - vh + 40, behavior: 'auto' });
  }

  // ── 启动 ────────────────────────────────────────────────────────
  load();
  apply();
  renderHead();
  renderTask();
  renderMainline();
  renderL2();
  renderL3();
  renderFoot();
  renderTweaks();
  var wasOpen = false;
  try { wasOpen = localStorage.getItem(SAVE_KEY + ':open') === '1'; } catch (e) { /* ignore */ }
  setTweaks(wasOpen);

  $('#tw-open').addEventListener('click', function () { setTweaks(true); });
  $('#tw-close').addEventListener('click', function () { setTweaks(false); });
  document.addEventListener('keydown', function (e) {
    if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if (e.key === 'j') { focusStep(1); e.preventDefault(); }
    else if (e.key === 'k') { focusStep(-1); e.preventDefault(); }
    else if (e.key === 'Enter' && document.activeElement && document.activeElement.classList.contains('row')) {
      var b = document.activeElement.querySelector('.qbtn');
      if (b) b.click();
    } else if (e.key === 'Escape') { setTweaks(false); }
  });
})();
</script>
